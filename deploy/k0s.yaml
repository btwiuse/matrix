apiVersion: v1
data:
  inject.html: |
    <style>
    #gearshell-floating-ball {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 12px;
      background: #222222;
      border-radius: 12px;
      display: flex;
      align-items: center;
      color: #F8F8F8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      z-index: 9999;
      transition: all 0.3s ease;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #gearshell-floating-ball:hover {
      transform: translateY(-2px);
      background: #383838;
    }
    .gearshell-ball-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gearshell-logo {
      width: 20px;
      height: 20px;
      background-image: url("data:image/png;base64,");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 18px 18px;
      background-color: #F8F8F8;
      border-radius: 4px;
    }

    .gearshell-ball-text {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .gearshell-close-icon {
      margin-left: 8px;
      font-size: 16px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    .gearshell-close-icon:hover {
      opacity: 1;
    }
    </style>
    <div id="gearshell-floating-ball" role="button"
      aria-label="Created by GearShell">
      <div class="gearshell-ball-content">
        <div class="gearshell-logo"></div>
        <span class="gearshell-ball-text">Created by GearShell</span>
      </div>
      <div class="gearshell-close-icon" role="button" aria-label="关闭">×</div>
    </div>
    <script>
    // Initialize floating ball functionality
    (function () {
      if (window.__gearshellBallLoaded) return; // 幂等: 重复注入只保留一份
      window.__gearshellBallLoaded = true;

      function initFloatingBall() {
        const ball = document.getElementById("gearshell-floating-ball");
        if (!ball) return;

        // Initial animation
        ball.style.opacity = "0";
        ball.style.transform = "translateY(20px)";

        setTimeout(() => {
          ball.style.opacity = "1";
          ball.style.transform = "translateY(0)";
        }, 500);

        // Handle logo click
        const ballContent = ball.querySelector(".gearshell-ball-content");
        ballContent.addEventListener("click", function (e) {
          e.stopPropagation();
          window.open("https://github.com/gearshell", "_blank");
          ball.style.transform = "scale(0.95)";
          setTimeout(() => {
            ball.style.transform = "scale(1)";
          }, 100);
        });

        // Handle close button click
        const closeIcon = ball.querySelector(".gearshell-close-icon");
        closeIcon.addEventListener("click", function (e) {
          e.stopPropagation();
          ball.style.opacity = "0";
          ball.style.transform = "translateY(20px)";

          setTimeout(() => {
            ball.style.display = "none";
          }, 300);
        });
      }

      // Initialize when DOM is ready (fallback if already interactive)
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initFloatingBall);
      } else {
        initFloatingBall();
      }
    })();
    </script>
kind: ConfigMap
metadata:
  name: matrix-inject
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-config
  namespace: default
data:
  MATRIX_DATA_DIR: "/data"
  MATRIX_WORKSPACE: "/workspace"
  MATRIX_DOMAIN: "matrix.k0s.io"
  MATRIX_SCHEME: "https"
  PORT: "8080"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matrix-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matrix
  template:
    metadata:
      labels:
        app: matrix
    spec:
      containers:
        - name: matrix
          image: btwiuse/arch:golang
          imagePullPolicy: Always
          command:
            - bash
            - -c
          args:
            - |
              set -e
              cd /tmp
              git clone --depth 1 https://github.com/gearshell/matrix.git src
              cd src
              go build -o /usr/local/bin/matrix ./cmd/matrix
              exec matrix --inject /etc/matrix/inject.html
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: matrix-config
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workspace
              mountPath: /workspace
            - name: inject
              mountPath: /etc/matrix
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matrix-data
        - name: workspace
          emptyDir: {}
        - name: inject
          configMap:
            name: matrix-inject
---
apiVersion: v1
kind: Service
metadata:
  name: matrix
  namespace: default
spec:
  selector:
    app: matrix
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: matrix.k0s.io
  namespace: default
spec:
  dnsNames:
    - matrix.k0s.io
    - "*.matrix.k0s.io"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  secretName: matrix.k0s.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix.k0s.io
  namespace: default
  annotations:
    ingress.kubernetes.io/force-ssl-redirect: "true"
    ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: matrix.k0s.io
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: matrix
                port:
                  number: 8080
    - host: "*.matrix.k0s.io"
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: matrix
                port:
                  number: 8080
  tls:
    - hosts:
        - matrix.k0s.io
        - "*.matrix.k0s.io"
      secretName: matrix.k0s.io
